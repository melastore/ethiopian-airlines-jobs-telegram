name: check careers pages

on:
  schedule:
    # Every two hours, every day. Odd hours in UTC are even hours in Addis Ababa.
    - cron: "0 1-23/2 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Command to execute (run or prime)"
        required: true
        default: "run"
        type: choice
        options:
          - run
          - prime

# Two runs at once could send the same posting twice.
concurrency:
  group: careers-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Restore the delivery history
        run: |
          set -euo pipefail
          mkdir -p data
          if git fetch --depth=1 origin state 2>/dev/null \
             && git cat-file -e FETCH_HEAD:jobs.db 2>/dev/null; then
            git show FETCH_HEAD:jobs.db > data/jobs.db
            if git cat-file -e FETCH_HEAD:jobs.db-wal 2>/dev/null; then
              git show FETCH_HEAD:jobs.db-wal > data/jobs.db-wal
            fi
            echo "restored $(stat -c%s data/jobs.db) bytes"
          else
            echo "::warning::no history found, the flood guard will stop a mass send"
          fi

      - name: Check the history is readable
        run: python3 scripts/check_history.py data/jobs.db

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install .

      - name: Post anything new
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_PATH: data/jobs.db
        run: ethiopian-jobs ${{ inputs.command || 'run' }}

      - name: Save the delivery history
        # Runs even when a send failed, so what did go out is never sent twice.
        if: always()
        run: |
          test -f data/jobs.db || exit 0
          rows=$(python3 -c "import sqlite3; c = sqlite3.connect('data/jobs.db'); print(c.execute('SELECT count(*) FROM sent_posts').fetchone()[0])" 2>/dev/null || echo 0)
          if [ "$rows" -eq 0 ]; then
            echo "no delivered posts in history, skipping save to state branch"
            exit 0
          fi
          git config user.name "melastore"
          git config user.email "melastore@users.noreply.github.com"
          rm -rf /tmp/state && mkdir /tmp/state
          cp data/jobs.db /tmp/state/jobs.db
          test -f data/jobs.db-wal && cp data/jobs.db-wal /tmp/state/jobs.db-wal || true
          cd /tmp/state
          git init -q -b state
          # A commit made with a personal token counts as repository activity, which
          # is what stops GitHub disabling the schedule after 60 quiet days. Without
          # STATE_TOKEN this still works, the schedule just needs waking by hand.
          git remote add origin "https://x-access-token:${{ secrets.STATE_TOKEN || github.token }}@github.com/${{ github.repository }}.git"
          git config user.name "melastore"
          git config user.email "melastore@users.noreply.github.com"
          git add jobs.db
          test -f jobs.db-wal && git add jobs.db-wal || true
          git commit -q -m "Delivery history $(date -u +%Y-%m-%dT%H:%MZ)"
          # A push that never lands leaves stale history behind, and the next run
          # would repost whatever this one just sent.
          for attempt in 1 2 3 4 5; do
            if git push -q --force origin state; then
              echo "history saved on attempt $attempt"
              exit 0
            fi
            echo "::warning::push attempt $attempt failed, retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not save the delivery history, the next run may repeat posts"
          exit 1
