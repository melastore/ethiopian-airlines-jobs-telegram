[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ethiopian-airlines-jobs-telegram"
version = "1.1.0"
description = "Posts new Ethiopian Airlines local vacancies and recruitment results to a Telegram channel."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "melastore" }]
keywords = ["ethiopian-airlines", "jobs", "telegram", "scraper"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
ethiopian-jobs = "ethiopian_jobs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ethiopian_jobs"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

